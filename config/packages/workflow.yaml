framework:
    workflows:
        # Generic revision lifecycle, shared by every revisable domain (activities, companies, vacancies, ...).
        # `supports` lists the abstract base App\Entity\Application\AbstractRevision; the workflow registry matches
        # subjects with `instanceof`, so every concrete *Revision (ActivityRevision, CompanyRevision, ...) is covered
        # automatically without enumerating them here.
        #
        # Places are the string values of App\Entity\Application\Enums\RevisionStatus; the marking is stored on the
        # revision entity's `status` enum column through App\Workflow\RevisionStatusMarkingStore.
        #
        # Creating a *new* revision (a brand-new draft, the draft spawned after `request_changes`, the draft cloned
        # when editing an approved entity, or reopening a rejected one) is entity instantiation at the `draft` initial
        # place; it is deliberately NOT a transition, so every submitted revision stays an immutable record.
        revision:
            type: state_machine
            marking_store:
                service: App\Workflow\RevisionStatusMarkingStore
            supports:
                - App\Entity\Application\AbstractRevision
            initial_marking: draft
            places:
                - draft
                - submitted
                - in-review
                - changes-requested
                - rejected
                - closed
                - approved
            transitions:
                submit:
                    from: draft
                    to: submitted
                # A submission must first be claimed for review; approve/reject/request_changes only become
                # reachable once the revision is `in-review`, never straight from `submitted`.
                start_review:
                    from: submitted
                    to: in-review
                request_changes:
                    from: in-review
                    to: changes-requested
                reject:
                    from: in-review
                    to: rejected
                approve:
                    from: in-review
                    to: approved
                close:
                    from: rejected
                    to: closed

        # The option calendar. A proposal is not a revisable aggregate: it has no revision chain, no draft and no
        # review discussion, so it does not belong on the `revision` machine, but claiming a date is an approval
        # lifecycle all the same and belongs on a machine rather than in a service full of status assignments.
        #
        # Places are the string values of App\Entity\Activity\Enums\ProposalStatus, stored on the proposal's `status`
        # column through App\Workflow\ProposalStatusMarkingStore.
        #
        # Handing a proposal in is entity instantiation at the `submitted` place, not a transition, for the same reason
        # as a revision's draft: what a body handed in stays a record of what it handed in.
        #
        # `clear_budget` covers both ways the financial side is settled, an approved budget and an activity that costs
        # nothing, because a free activity has nothing to hand in and must not be chased for it. Board meetings are not
        # known in advance, so the board records the outcome here rather than the website working out a deadline from
        # one. Only a proposal still holding an unsettled date can `lapse`.
        #
        # `reopen`, `revoke_clearance` and withdrawing a cleared proposal exist so nothing is a dead end: a lapsed date
        # can be put back in the running, a clearance recorded by mistake can be taken back, and a wrong approval is
        # undone by reopening and picking another date.
        activity_proposal:
            type: state_machine
            marking_store:
                service: App\Workflow\ProposalStatusMarkingStore
            supports:
                - App\Entity\Activity\ActivityProposal
            initial_marking: submitted
            places:
                - submitted
                - scheduled
                - cleared
                - declined
                - withdrawn
                - lapsed
            transitions:
                schedule:
                    from: submitted
                    to: scheduled
                decline:
                    from: submitted
                    to: declined
                clear_budget:
                    from: scheduled
                    to: cleared
                revoke_clearance:
                    from: cleared
                    to: scheduled
                withdraw:
                    from: [submitted, scheduled, cleared]
                    to: withdrawn
                lapse:
                    from: scheduled
                    to: lapsed
                reopen:
                    from: [declined, withdrawn, lapsed]
                    to: submitted
